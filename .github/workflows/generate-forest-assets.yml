name: Generate forest terrain assets
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_forest_tiles.py"
      - ".github/workflows/generate-forest-assets.yml"
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python tools/generate_forest_tiles.py
      - uses: actions/upload-artifact@v4
        with:
          name: forest-ground-tiles
          path: assets/tilesets/forest_ground/
