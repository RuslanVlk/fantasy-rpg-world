name: Generate forest terrain assets

concurrency:
  group: forest-assets-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/import_kenney_sheet.py"
      - "tools/slice_kenney_sheet.py"
      - "tools/extract_kenney_forest_trees.py"
      - "tools/extract_kenney_forest_plants.py"
      - "assets/source/kenney_roguelike/roguelikeSheet_transparent.png.b64"
      - "tools/generate_forest_tiles.py"
      - "tools/forest_autotile.py"
      - "tools/generate_forest_demo_map.py"
      - "tools/export_forest_demo_tiled.py"
      - "tools/generate_forest_navigation.py"
      - "tools/generate_blob_masks.py"
      - "tools/validate_forest_assets.py"
      - ".github/workflows/generate-forest-assets.yml"
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Import licensed Kenney 3/4 RPG source sheet
        run: python tools/import_kenney_sheet.py
      - name: Split CC0 atlas into independent tile PNGs
        run: python tools/slice_kenney_sheet.py
      - name: Extract independent forest tree sprites
        run: python tools/extract_kenney_forest_trees.py
      - name: Extract independent forest plant sprites
        run: python tools/extract_kenney_forest_plants.py
      - name: Generate ground materials
        run: python tools/generate_forest_tiles.py
      - name: Generate 47 blob transition masks
        run: python tools/generate_blob_masks.py
      - name: Render forest demo map
        run: python tools/generate_forest_demo_map.py
      - name: Export editable Tiled JSON map
        run: python tools/export_forest_demo_tiled.py
      - name: Export walkability, trunk collisions and canopy occlusion
        run: python tools/generate_forest_navigation.py
      - name: Export walkability, trunk collisions and canopy occlusion
        run: python tools/generate_forest_navigation.py
      - name: Validate dimensions, atlases and tile seams
        run: python tools/validate_forest_assets.py
      - name: Commit generated assets to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/third_party/kenney_roguelike/ assets/tilesets/forest_ground/ assets/environment/forest/ assets/maps/forest_demo/
          if git diff --cached --quiet; then
            echo "Generated assets are already up to date."
          else
            git commit -m "Generate validated forest ground and autotile assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: forest-ground-and-autotile-assets
          path: |
            assets/tilesets/forest_ground/
            assets/third_party/kenney_roguelike/
            assets/environment/forest/
            assets/maps/forest_demo/
